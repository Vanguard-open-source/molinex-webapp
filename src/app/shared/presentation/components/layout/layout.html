<div class="application-shell" [class.application-shell--public]="!iam.isSignedIn()">
  @if (iam.isSignedIn()) {
    <div class="navigation-panel" [class.navigation-panel--open]="navigationOpen()">
      <app-side-navigation [navigationGroups]="options()" (navigated)="closeNavigation()" />
    </div>
  }
  @if (navigationOpen() && iam.isSignedIn()) {
    <button
      class="navigation-backdrop"
      type="button"
      [attr.aria-label]="'shell.close-navigation' | translate"
      (click)="closeNavigation()"
    ></button>
  }

  <div class="application-shell__content">
    <app-top-bar (menuToggled)="toggleNavigation()" />
    <main class="page-content" id="main-content" tabindex="-1">
      @if (iam.notice(); as notice) {
        <p role="alert" aria-live="assertive">{{ notice | translate }}</p>
      }
      <router-outlet />
    </main>
    <app-footer-content />
  </div>
</div>
